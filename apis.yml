aid: infinera
name: Infinera
description: >-
  Infinera is a vertically integrated optical networking and DWDM transport
  equipment vendor, known for its in-house photonic integrated circuits, coherent
  optical engines (ICE), XR optics, and the GX, Groove, and FlexILS system lines
  used by carriers, cloud/internet-content providers, and enterprises to build
  high-capacity transport networks. Infinera was acquired by Nokia (completed in
  2025) and now operates as part of Nokia Optical Networks. Network programmability
  is delivered through open transport-networking standards (ONF TAPI, OpenConfig,
  gNMI/gNXI, NETCONF/YANG) and infrastructure automation (a published Terraform
  provider and an Ansible collection) rather than a single proprietary REST API.
